name: Проверка проекта
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: probnik
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: probnik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U probnik -d probnik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://probnik:test_password@localhost:5432/probnik_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
